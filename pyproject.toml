[project]
name = "fynq"
version = "0.1.0"
description = "Universal package manager and runtime for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ashwin" }]
dependencies = [
  "typer[all]>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.6.0",
  "pyyaml>=6.0.1",
  "litellm>=1.30.0",
  "supabase>=2.0.0",
  "gotrue>=1.0.0",
  "pyinstaller>=6.0.0",
]

[project.scripts]
fynq = "fynq_cli.main:app"

[build-system]
requires = ["setuptools>=68.2.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
